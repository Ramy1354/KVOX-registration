<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 40px;
        }

        .dashboard-container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            color: #333;
        }

        .card {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .card h2 {
            margin-top: 0;
            color: blue;
            font-size: 2.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: blue;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .refresh-btn {
            background-color: blue;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
        }

        .refresh-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <h1>Developer Dashboard</h1>
        
        <div class="card">
            <h3>Total Registered Users</h3>
            <h2 id="user-count">0</h2>
        </div>

        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3>User List</h3>
                <button class="refresh-btn" onclick="fetchUserData()">Refresh Data</button>
            </div>
            
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Email</th>
                    </tr>
                </thead>
                <tbody id="user-table-body">
                    <!-- User rows will be inserted here dynamically -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function fetchUserData() {
            try {
                // Fetch the live data from your new API endpoint
                const response = await fetch('/api/users');
                const data = await response.json();

                // Update total count
                document.getElementById('user-count').textContent = data.totalUsers;

                // Populate the table
                const tableBody = document.getElementById('user-table-body');
                tableBody.innerHTML = ''; 

                if (data.registeredUsers.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="3" style="text-align: center;">No registered users yet.</td></tr>';
                    return;
                }

                data.registeredUsers.forEach(user => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${user.id}</td>
                        <td>${user.username}</td>
                        <td>${user.email}</td>
                    `;
                    tableBody.appendChild(row);
                });
            } catch (error) {
                console.error('Error loading dashboard data:', error);
            }
        }

        // Fetch user data automatically when the page loads
        fetchUserData();
    </script>
</body>
</html>
